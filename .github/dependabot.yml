version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      kotlin-build:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.android.*"
      ktor:
        patterns:
          - "io.ktor*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
