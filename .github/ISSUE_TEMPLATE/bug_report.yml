name: Bug report
description: Report reproducible library behavior using redacted data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include cookies, tokens, signed media URLs, account identifiers, or authenticated captures.
  - type: input
    id: version
    attributes:
      label: InnerDiscoX version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, JVM]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or fully redacted values.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: text
